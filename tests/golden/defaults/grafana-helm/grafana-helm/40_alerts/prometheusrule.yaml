apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  annotations: {}
  labels:
    monitoring.syn.tools/enabled: 'true'
    name: grafana-helm
  name: grafana-helm
spec:
  groups:
    - name: grafana-helm
      rules:
        - alert: GrafanaDatasourceErrors
          annotations:
            description: Datasource {{ $labels.datasource }} ({{ $labels.datasource_type
              }}) has been returning errors for 30 minutes.
            summary: Grafana datasource {{ $labels.datasource }} is returning errors
          expr: sum by (datasource, datasource_type, code) (rate(grafana_datasource_request_total{code!="200"}[5m]))
            > 0
          for: 30m
          labels:
            severity: warning
            syn: 'true'
            syn_component: grafana-helm
