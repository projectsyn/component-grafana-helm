applications:
  - openshift4-logging

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-openshift4-monitoring/master/lib/openshift4-monitoring-prom.libsonnet
        output_path: vendor/lib/prom.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-openshift4-monitoring/master/lib/openshift4-monitoring-alert-patching.libsonnet
        output_path: vendor/lib/alert-patching.libsonnet

  facts:
    distribution: openshift4

  openshift:
    appsDomain: apps.example.com
    baseDomain: example.com

  grafana_helm:
    openshiftIntegration:
      enabled: true
      ingress:
        urlPrefix: my-grafana
      metrics:
        enabled: true
      logsApps:
        enabled: false
      logsInfra:
        enabled: false
      logsAudit:
        enabled: false

    helm_values:
      sidecar:
        dashboards:
          enabled: true
          searchNamespace:
            - syn-airlock-microgateway
            - syn-topolvm
        datasources:
          enabled: true
          searchNamespace: ALL
