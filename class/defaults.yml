parameters:
  grafana_helm:
    =_metadata:
      multi_instance: true
      multi_tenant: true

    namespace: syn-grafana
    createNamespace: true
    namespaceLabels: {}
    namespaceAnnotations: {}

    secrets: {}

    charts:
      grafana:
        source: https://grafana-community.github.io/helm-charts
        version: 12.4.9

    images:
      grafana:
        registry: docker.io
        repository: grafana/grafana
        tag: 13.0.4
      sidecar:
        registry: quay.io
        repository: kiwigrid/k8s-sidecar
        tag: 2.7.4

    dashboards: {}
    datasources: {}
    extraConfigMap: {}

    openshiftIntegration:
      enabled: false
      auth:
        adminUser: 'admin'
        adminPassword: '?{vaultkv:${cluster:tenant}/${cluster:name}/${_instance}/admin_password}'
        scopes: 'user:info user:check-access user:list-projects'
        roleAttributePath: "contains(groups[*], 'openshiftroot') && 'GrafanaAdmin' || 'Editor'"
      ingress:
        urlPrefix: ${_instance}
      # OpenShift Datasources
      metrics:
        enabled: true
        name: Prometheus
      logsApps:
        enabled: true
        name: OpenShift Logging (Application)
      logsInfra:
        enabled: true
        name: OpenShift Logging (Infrastructure)
      logsAudit:
        enabled: false
        name: OpenShift Logging (Audit)

    helm_values:
      serviceMonitor:
        enabled: true
      testFramework:
        enabled: false
      initChownData:
        enabled: false
      deploymentStrategy:
        type: Recreate

    metricsRoute:
      enabled: true

    prometheusRule:
      labels:
        syn: 'true'
      groups:
        grafana-helm:
          GrafanaDatasourceErrors:
            expr: 'sum by (datasource, datasource_type, code) (rate(grafana_datasource_request_total{code!="200"}[5m])) > 0'
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: 'Grafana datasource {{ $labels.datasource }} is returning errors'
              description: 'Datasource {{ $labels.datasource }} ({{ $labels.datasource_type }}) has been returning 5xx errors for 30 minutes.'
